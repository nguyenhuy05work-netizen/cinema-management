spring.application.name=demo

# Server
server.port=8080

# MySQL datasource
spring.datasource.url=jdbc:mysql://localhost:3306/cinemamanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pages123@}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway (tắt nếu chưa có migration)
spring.flyway.enabled=false

# JWT Configuration
app.jwt.secret=9a2f8c4e1b7d3f5a8c2e4b6a9c1d3f5a8c2e4b6a9c1d3f5a8c2e4b6a9c1d3f5a
app.jwt.expiration-milliseconds=86400000
app.jwt.refresh-expiration-in-ms=604800000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nguynhuwg@gmail.com
spring.mail.password=pwjb nler gsla utwb
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
