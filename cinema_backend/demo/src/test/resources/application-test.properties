# Database test trong bộ nhớ
spring.datasource.url=jdbc:h2:mem:cinema_booking_tests;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Không gửi email thật
spring.mail.host=localhost
spring.mail.username=
spring.mail.password=

app.backend.url=http://localhost:8080
app.frontend-url=https://example.test

# Khóa JWT giả, chỉ dùng cho test
app.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.expiration-milliseconds=86400000
app.jwt.refresh-expiration-milliseconds=604800000

# Cấu hình VNPay giả cho test
app.vnpay.tmn-code=TESTONLY
app.vnpay.hash-secret=test-only-vnpay-secret
app.vnpay.return-url=https://example.test/api/v1/payments/vnpay/return

app.booking.expiry-check-ms=3600000